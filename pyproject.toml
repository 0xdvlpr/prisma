[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planet-front-page"
version = "1.0.0"
description = "Top five news stories for every country in the world, with an open API."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "feedparser>=6.0",
  "PyYAML>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
# pygooglenews is unmaintained; the Google News collector falls back to plain RSS without it.
gnews = ["pygooglenews>=0.1.3"]
enrich = ["news-please>=1.6"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
pfp = "pfp.cli:main"

[tool.setuptools.packages.find]
include = ["pfp*"]

[tool.setuptools.package-data]
"pfp.data" = ["*.csv", "*.db"]
