<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prisma Daily</title>
<meta name="description" content="The top stories from every country, every day. Prisma Brief in three minutes.">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0B0D">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..800&display=swap">
<style>
/* Layout: dark-first phone app. Top bar (logo, trust label, streak), bottom tabs, big tappable cards.
   The Brief is a full-screen vertical swipe deck; audio and share live in bottom sheets. Desktop adds a right rail. */
:root{
  --bg:#0B0B0D; --card:#17171B; --card2:#202026; --ink:#F5F5F6; --ink2:#CFCFD4; --muted:#9C9CA5; --faint:#5F5F68; --line:#28282F;
  --accent:#FF5A43; --accent-ink:#1A0602; --accent-soft:rgba(255,90,67,.16); --good:#4ADE80;
  --land:#26262C; --ocean:#101013; --hit1:#4D2721; --hit5:#FF5A43;
  --font:"DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --r:22px; --tap:48px; --sw:0px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F2F2F4; --card:#FFFFFF; --card2:#F6F6F8; --ink:#0B0B0D; --ink2:#35353C; --muted:#696972; --faint:#A8A8B0; --line:#E2E2E7;
  --accent:#E8432C; --accent-ink:#FFFFFF; --accent-soft:rgba(232,67,44,.12); --good:#15803D;
  --land:#DCDCE2; --ocean:#ECEDF1; --hit1:#F8C9C1; --hit5:#E8432C;
  color-scheme:light;
}
:root[data-theme="dark"]{color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:clip}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5;font-weight:400;-webkit-font-smoothing:antialiased;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){body{padding-bottom:0;padding-left:var(--sw)}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:inherit}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.num,.n,.rk,time{font-variant-numeric:tabular-nums}
.skip{position:absolute;left:-999px;top:8px;z-index:100;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:999px;font-weight:600}
.skip:focus{left:12px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.top .wrap{display:flex;align-items:center;gap:10px;height:60px}
.logo{border:0;background:none;padding:0;font-weight:800;font-size:27px;letter-spacing:-.045em;line-height:1;color:var(--ink)}
.logo i{font-style:normal;color:var(--accent)}
.trust{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.trust b{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block}
.trust .long{display:none}
@media (min-width:520px){.trust .long{display:inline}.trust .short{display:none}}
.tabs-d{display:none;gap:2px;margin-left:12px}

.tabs-d button{border:0;background:none;padding:9px 14px;border-radius:999px;font-weight:600;color:var(--muted);font-size:15px}
.tabs-d button[aria-current="true"]{color:var(--ink);background:var(--card)}
.top .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.streak{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--card);border-radius:999px;padding:0 12px 0 10px;height:40px;font-weight:600;font-size:14px;white-space:nowrap}
.streak svg{width:18px;height:18px;stroke:var(--accent);fill:var(--accent)}
.streak .long{display:none}
@media (min-width:520px){.streak .long{display:inline}}
.ibtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);display:grid;place-items:center;color:var(--ink)}

/* bottom tabs */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.tabbar{display:none}}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);min-height:56px;justify-content:center}
.tabbar button[aria-current="true"]{color:var(--ink)}
.tabbar button[aria-current="true"] svg{stroke:var(--accent)}
.tabbar .mid .bub{width:52px;height:52px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-22px;box-shadow:0 10px 24px -10px var(--accent)}
.tabbar .mid .bub svg{stroke:var(--accent-ink)}

/* common */
.pg{padding-block:8px 40px}
.h1{font-weight:800;font-size:clamp(32px,7vw,52px);letter-spacing:-.04em;line-height:1;margin:12px 0 6px;text-wrap:balance}
.lede{color:var(--muted);font-size:17px;margin:0 0 18px;max-width:42ch}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:32px 0 12px}
.sec-h h2{font-weight:800;font-size:23px;letter-spacing:-.03em;margin:0}
.sec-h button{border:0;background:none;color:var(--accent);font-weight:600;font-size:15px;padding:8px 0;display:inline-flex;align-items:center;gap:2px}
.chip{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;background:var(--card2);padding:4px 11px 4px 5px;min-height:30px;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap}
.chip .cc{font-size:11px;font-weight:600;background:var(--ink);color:var(--bg);border-radius:999px;padding:2px 6px;letter-spacing:.02em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;min-height:var(--tap);padding:0 20px;font-weight:600;font-size:16px;background:var(--card2);color:var(--ink);text-decoration:none}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn svg.i{width:20px;height:20px}
.seg{display:inline-flex;background:var(--card);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:none;border-radius:999px;padding:9px 16px;font-weight:600;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.filt{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px}
.filt::-webkit-scrollbar{display:none}
.filt button{flex:none;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:9px 15px;font-weight:600;font-size:15px;color:var(--ink2)}
.filt button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.heat{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
.heat i{width:4px;border-radius:2px;background:var(--line)}
.heat i.on{background:var(--accent)}
.ai{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.ai b{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:15px;z-index:95;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);max-width:calc(100% - 32px);text-align:center}
@media (min-width:700px){.toast{bottom:28px;left:calc(50% + var(--sw) / 2)}}
.empty{background:var(--card);border-radius:var(--r);padding:22px;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:19px;font-weight:800;margin-bottom:4px;letter-spacing:-.02em}
.skel{display:grid;gap:12px;padding-block:20px}
.skel i{display:block;height:140px;border-radius:var(--r);background:var(--card)}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
.cols>*,.feed>*{min-width:0}
@media (min-width:1360px){.cols{grid-template-columns:minmax(0,1fr) 340px}.rail{position:sticky;top:84px;align-self:start}}
@media (min-width:700px) and (max-width:1359px){.rail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}.rail .card,.rail .stats{margin:0}}

/* today */
.hey .day{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.briefcard{background:var(--accent);color:var(--accent-ink);border-radius:28px;padding:22px 20px 20px;margin-top:14px;position:relative;overflow:hidden}
.briefcard h2{font-weight:800;font-size:clamp(26px,5.6vw,36px);letter-spacing:-.035em;line-height:1.04;margin:0 0 6px;max-width:16ch}
.briefcard p{margin:0 0 16px;font-size:16px;opacity:.85;max-width:34ch}
.briefcard .row{display:flex;gap:10px;flex-wrap:wrap}
.briefcard .btn{background:var(--accent-ink);color:var(--accent);min-height:52px;font-size:17px}
.briefcard .btn.ghost{background:transparent;border:1.5px solid color-mix(in srgb,var(--accent-ink) 35%,transparent);color:var(--accent-ink)}
.briefcard .stack{position:absolute;right:-20px;top:18px;display:grid;gap:6px;opacity:.22;pointer-events:none}
.briefcard .stack i{display:block;width:120px;height:26px;border-radius:8px;background:var(--accent-ink)}
.briefcard.done{background:var(--card);color:var(--ink)}
.briefcard.done .btn{background:var(--card2);color:var(--ink)}
.nudge{display:flex;align-items:center;gap:10px;background:var(--accent-soft);color:var(--ink);border-radius:16px;padding:12px 14px;margin-top:12px;font-weight:600;font-size:15px}
.nudge svg{stroke:var(--accent)}
.rings{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;margin:18px -16px 4px;padding:4px 16px 6px}
.rings::-webkit-scrollbar{display:none}
.ring{flex:none;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;width:70px}
.ring .disc{width:64px;height:64px;border-radius:50%;padding:3px;background:var(--accent)}
.ring.seen .disc{background:var(--line)}
.ring .in{width:100%;height:100%;border-radius:50%;background:var(--card);border:3px solid var(--bg);display:grid;place-items:center;font-weight:800;font-size:16px;letter-spacing:-.02em}
.ring span{font-size:12.5px;font-weight:600;color:var(--ink2);max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.lead{background:var(--card);border-radius:28px;overflow:hidden;position:relative}
.lead svg.bg{display:block;width:100%;height:170px;background:var(--ocean)}
.lead .body{padding:4px 20px 14px}
.lead .tag{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.08em}
.lead h2{font-weight:800;font-size:clamp(27px,5.4vw,42px);line-height:1.05;letter-spacing:-.035em;margin:8px 0 10px;text-wrap:balance;max-width:22ch}
.lead h2 a{text-decoration:none}
.lead h2 a:hover{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px}
.card{background:var(--card);border-radius:var(--r);padding:16px 16px 10px;min-width:0}
.card .top-row{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.card h3{font-weight:700;font-size:clamp(20px,2.6vw,23px);line-height:1.2;letter-spacing:-.02em;margin:8px 0 6px;text-wrap:pretty;max-width:38ch}
.card h3 a{text-decoration:none;color:var(--ink)}
.card h3 a:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.en{color:var(--ink2);font-size:16px;margin:-2px 0 6px;max-width:42ch}
.en b{font-weight:600;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.06em;margin-right:6px}
.src{font-size:14px;color:var(--muted)}
.lang{font-size:12.5px;font-weight:600;border:1.5px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--ink2)}
.acts{display:flex;flex-wrap:wrap;gap:2px;margin:8px -8px 0}
.act{border:0;background:none;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:0 10px;min-height:44px;font-size:14.5px;font-weight:600;color:var(--ink2)}
.act:hover{background:var(--card2)}
.act svg.i{width:20px;height:20px}
.act.on{color:var(--accent)}
.act.on svg{fill:currentColor}
.feed{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}

.take{background:var(--card);border-radius:var(--r);padding:18px;border:1.5px solid var(--line)}
.take h3{font-weight:800;font-size:22px;letter-spacing:-.03em;margin:0 0 4px}
.take p{margin:0 0 14px;color:var(--muted);font-size:16px}
.take ol{margin:6px 0 12px;padding-left:22px;display:grid;gap:10px;font-size:17px;line-height:1.5}
.carousel{display:grid;grid-auto-flow:column;grid-auto-columns:min(80%,300px);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-bottom:4px}
.carousel::-webkit-scrollbar{display:none}
.carousel>*{scroll-snap-align:start}
.regcard{background:var(--card);border-radius:var(--r);padding:16px}
.regcard h4{margin:0;font-weight:800;font-size:21px;letter-spacing:-.03em;display:flex;justify-content:space-between;align-items:baseline}
.regcard h4 button{border:0;background:none;padding:0;font:inherit}
.regcard h4 span{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0}
.regcard ol{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:12px}
.regcard li a{text-decoration:none;font-weight:600;font-size:16px;line-height:1.3;display:block}
.regcard li small{display:block;color:var(--muted);font-size:13px;font-weight:600}
.aus{background:var(--card);border-radius:var(--r);padding:16px}
.aus .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.aus h2{font-weight:800;font-size:23px;letter-spacing:-.03em;margin:0}
.aus .head>span{color:var(--muted);font-size:14px}
.aus ol{list-style:none;margin:10px 0 0;padding:0}
.aus li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.aus li:last-child{border-bottom:0}
.aus .n{font-weight:800;color:var(--accent)}
.aus a{text-decoration:none;font-weight:700;font-size:17px;line-height:1.3;letter-spacing:-.01em}
.aus small{display:flex;flex-wrap:wrap;gap:4px 8px;color:var(--muted);font-size:13px;margin-top:4px;align-items:center}
.otype{font-size:12px;font-weight:600;border-radius:999px;padding:1px 8px;background:var(--card2);color:var(--ink2)}
.mapteaser{display:block;width:100%;border:0;padding:0;background:var(--card);border-radius:var(--r);overflow:hidden;text-align:left}
.mapteaser svg{display:block;width:100%;height:auto}
.mapteaser .cap{padding:12px 16px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.mapteaser .cap b{font-size:19px;font-weight:800;letter-spacing:-.02em}
.mapteaser .cap span{color:var(--muted);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.stat{background:var(--card);border-radius:16px;padding:12px}
.stat b{display:block;font-size:26px;font-weight:800;line-height:1;letter-spacing:-.03em}
.stat span{font-size:13px;color:var(--muted);font-weight:600}
.rail .card{margin-bottom:12px}
.mini{list-style:none;margin:0;padding:0}
.mini li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.mini li:last-child{border-bottom:0}
.mini .n{font-weight:800;color:var(--accent)}
.mini a{text-decoration:none;font-weight:600;font-size:15.5px;line-height:1.3}
.mini small{display:block;color:var(--muted);font-size:13px;margin-top:2px}

/* top (ranked) */
.plist{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px}
.pitem{background:var(--card);border-radius:20px;padding:14px 14px 8px 8px;display:grid;grid-template-columns:48px minmax(0,1fr);gap:6px}
.pitem .rk{font-weight:800;font-size:28px;line-height:1;text-align:center;color:var(--faint);letter-spacing:-.04em;padding-top:4px}
.pitem:nth-child(-n+3) .rk{color:var(--accent)}
.pitem h3{font-weight:700;font-size:19px;line-height:1.22;letter-spacing:-.02em;margin:6px 0 4px}
.pitem h3 a{text-decoration:none}
.pitem h3 a:hover{text-decoration:underline}
.pitem .meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:14px;color:var(--muted)}

/* map */
.mapwrap{position:relative;background:var(--ocean);border-radius:var(--r);overflow:hidden}
.mapwrap svg{display:block;width:100%;height:auto;touch-action:none}
.country-shape{stroke:var(--bg);stroke-width:.5}
.country-shape.sel{stroke:var(--ink);stroke-width:1.4}
.pin{stroke:var(--bg);stroke-width:1}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);font-size:20px;font-weight:600}
.maplay{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:900px){.maplay{grid-template-columns:minmax(0,1fr) 380px}.maplay .sheet{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto}}
.sheet{background:var(--card);border-radius:var(--r);padding:16px}
.sheet h3{font-weight:800;font-size:27px;letter-spacing:-.035em;margin:0 0 2px}
.sheet .meta{color:var(--muted);font-size:14px;margin-bottom:8px}
.sheet ol{list-style:none;margin:0;padding:0}
.sheet li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:6px;padding:11px 0;border-bottom:1px solid var(--line)}
.sheet li:last-child{border-bottom:0}
.sheet li .n{font-weight:800;color:var(--accent)}
.sheet li a{text-decoration:none;font-weight:600;line-height:1.3}
.sheet li small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.sheet .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tip{position:absolute;pointer-events:none;background:var(--card);border-radius:12px;padding:8px 11px;max-width:260px;box-shadow:0 10px 24px -10px rgba(0,0,0,.6);z-index:3;font-size:14px;font-weight:600}
.tip b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}

/* ask */
.askpg{display:flex;flex-direction:column;min-height:calc(100dvh - 60px - 84px - env(safe-area-inset-bottom,0px));max-width:760px;margin:0 auto}
@media (min-width:700px){.askpg{min-height:calc(100dvh - 60px)}}
.convo{flex:1;display:flex;flex-direction:column;gap:14px;padding:12px 0 16px}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-radius:22px 22px 6px 22px;padding:11px 15px;max-width:85%;font-weight:600}
.msg.bot{background:var(--card);border-radius:22px 22px 22px 6px;padding:14px 16px;font-size:17px;line-height:1.55;max-width:62ch}
.msg.bot p{margin:0 0 8px}
.msg.bot sup a{font-size:11px;font-weight:600;background:var(--accent-soft);color:var(--accent);text-decoration:none;border-radius:6px;padding:1px 5px;margin-left:2px}
.msg.bot .srcs{margin-top:10px;border-top:1px solid var(--line);padding-top:10px;display:grid;gap:6px}
.msg.bot .srcs a{display:grid;grid-template-columns:22px minmax(0,1fr);gap:4px;font-size:14px;text-decoration:none;color:var(--ink2)}
.msg.bot .srcs b{color:var(--accent);font-size:12px}
.msg.bot .foot{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}

.tl{list-style:none;margin:0 0 0 6px;padding:0;border-left:2px solid var(--line)}

.where svg{display:block;width:100%;height:auto;aspect-ratio:2/1;border-radius:14px;background:var(--ocean)}
.pub{margin:0;padding:12px 0;border-top:1px solid var(--line);display:grid;gap:3px}
.pub:first-of-type{border-top:0;padding-top:0}

.pub dt small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.pub dd{margin:0;display:flex;justify-content:space-between;gap:10px;font-size:14px}
.pub dd span{color:var(--muted)}
.linkish{border:0;background:none;padding:8px 0 0;color:var(--accent);font-weight:600;font-size:14px}
.askcta{margin-top:16px}
.legend{margin:0;display:grid;gap:10px}

/* ---------- model ---------- */
const STOP=new Set("a an the and or of to in on for at by with from as is are was were be been it its this that after over into amid says said new news live latest his her their how what why who will could can may about up out than more".split(" "));
const toks=t=>new Set((t.toLowerCase().normalize("NFKD").match(/\p{L}[\p{L}0-9]+/gu)||[]).filter(w=>w.length>2&&!STOP.has(w)));
const isEnglish=s=>{if(s.language)return /^en/i.test(s.language);return !/[^\u0000-ɏ -⁯]/.test(s.title)};
let M={stories:[],byCountry:{},clusters:[],byId:{}};
function build(){
  const byCountry={};
  for(const s of S.stories){if(!BY[s.country]||S.editions[s.country])continue;(byCountry[s.country]||(byCountry[s.country]=[])).push(s)}
  for(const [cc,ed] of Object.entries(S.editions)){if(!BY[cc])continue;byCountry[cc]=(ed.stories||[]).map((x,i)=>({id:`${cc.toLowerCase()}-${i+1}`,country:cc,rank:i+1,title:x.title,url:x.url,source:x.source,published:x.published,language:x.language||"",section:x.section||"",local:!!x.local,stale:!!x.stale,outlets:x.outlets||0,also:x.also||[],otype:x.otype||""}))}
  const all=[],byId={};for(const k in byCountry){byCountry[k].sort((a,b)=>(a.rank||99)-(b.rank||99));for(const s of byCountry[k]){all.push(s);byId[s.id]=s}}
  const clusters=[];
  for(const s of all.filter(s=>s.section!=="Briefing")){const t=toks(s.title);let best=null,bs=0;
    for(const c of clusters){if(c.urls.has(s.url)){best=c;bs=1;break}let sh=0;t.forEach(w=>{if(c.t.has(w))sh++});if(sh<3)continue;const j=sh/new Set([...t,...c.t]).size;if(j>bs&&j>=.4){best=c;bs=j}}
    if(best){best.items.push(s);best.urls.add(s.url);t.forEach(w=>best.t.add(w))}else clusters.push({items:[s],urls:new Set([s.url]),t})}
  const now=nowRef();
  for(const c of clusters){c.items.sort((a,b)=>(a.rank||9)-(b.rank||9)||((when(b)||0)-(when(a)||0)));c.lead=c.items[0];c.countries=[...new Set(c.items.map(s=>s.country))];
    const bestRank=Math.min(...c.items.map(s=>s.rank||6));const t=when(c.lead);const days=t?Math.max(0,(now-t)/864e5):3;
    c.heat=Math.min(5,1+(c.items.length-1)+(c.countries.length-1)+(bestRank===1?1:0)+(c.lead.outlets>3?1:0));
    c.score=(12-2*bestRank)+4*(c.items.length-1)+2*(c.countries.length-1)+(SECT_WEIGHT[c.lead.section]??0)+(isEnglish(c.lead)?1:0)-1.1*days}
  clusters.sort((a,b)=>b.score-a.score);
  M={stories:all,byCountry,clusters,byId};
}
const covered=()=>Object.keys(M.byCountry).filter(k=>M.byCountry[k].length).length;
const trOf=s=>S.tr[s.id+"|"+s.title.length];

function streak(){const set=new Set(S.days);let n=0;const d=new Date();if(!set.has(today()))d.setDate(d.getDate()-1);
  for(;;){const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");if(set.has(k)){n++;d.setDate(d.getDate()-1)}else break}return n}
const informedToday=()=>S.days.includes(today());
function markInformed(){if(informedToday())return false;S.days=[...S.days,today()].slice(-400);store.set("newsie.days",S.days);paintStreak();return true}

function acts(s){const sv=!!S.saved[s.id];return `<div class="acts"><button class="act ${sv?"on":""}" data-save="${s.id}" aria-pressed="${sv}">${ICON.save}${sv?"Saved":"Save"}</button><button class="act" data-share="${s.id}">${ICON.share}Share</button>${isEnglish(s)||trOf(s)?`<button class="act" data-listen="${s.id}">${ICON.listen}Listen</button>`:`<button class="act" data-tr="${s.id}">${ICON.ask}English</button>`}<button class="act" data-askabout="${s.id}">${ICON.ask}Ask</button></div>`}
function card(c){const s=c.lead||c;const cl=c.items?c:null;const nw=isNew(s),rd=isRead(s),ds=distressing(s),hide=ds&&S.cover&&!S.revealed.has(s.id);
  return `<article class="card${rd?" read":""}"><div class="top-row">${nw?`<span class="newb">New</span>`:""}${(cl?cl.countries:[s.country]).slice(0,3).map(chip).join("")}<span>${ago(s)}</span>${kindChip(s)}${langTag(s)}${ds?`<span class="warn">May be distressing</span>`:""}${cl&&cl.items.length>1?`<span style="display:inline-flex;gap:5px;align-items:center">${heat(cl.heat)} ${cl.items.length} reports</span>`:""}</div>${hide?`<button class="reveal" data-reveal="${s.id}">This story may be distressing. Show headline</button>`:`<h3>${aStory(s)}${esc(s.title)}</a></h3>${enLine(s)}`}<div class="src">${pubA(s,'class="publink"')}${esc(s.source)} ↗</a>${rd?" · read":""}${s.stale?" · earlier edition":""}</div>${acts(s)}</article>`}

const PUB={"abc.net.au":["AU","Public broadcaster"],"sbs.com.au":["AU","Public broadcaster"],"bbc.com":["GB","Public broadcaster"],"bbc.co.uk":["GB","Public broadcaster"],"cbc.ca":["CA","Public broadcaster"],"npr.org":["US","Non-profit"],"pbs.org":["US","Non-profit"],
 "reuters.com":["GB","Wire agency"],"apnews.com":["US","Wire agency"],"aljazeera.com":["QA","State-funded"],"euronews.com":["FR","Commercial"],"bloomberg.com":["US","Commercial"],"cnn.com":["US","Commercial"],"cnbc.com":["US","Commercial"],
 "usnews.com":["US","Commercial"],"techcrunch.com":["US","Commercial"],"semafor.com":["US","Commercial"],"axios.com":["US","Commercial"],"theguardian.com":["GB","Trust-owned"],"theconversation.com":["AU","Non-profit"],
 "smh.com.au":["AU","Commercial"],"theage.com.au":["AU","Commercial"],"afr.com":["AU","Commercial"],"news.com.au":["AU","Commercial"],"2gb.com":["AU","Commercial"],"japantimes.co.jp":["JP","Commercial"],
 "thelocal.de":["DE","Commercial"],"mexiconewsdaily.com":["MX","Commercial"],"khaleejtimes.com":["AE","Commercial"],"fmprc.gov.cn":["CN","Government"],"consilium.europa.eu":["EU","Government"],"mx.usembassy.gov":["US","Government"]};
function pubInfo(s){const h=host(s.url);const parts=h.split(".");let p=PUB[h];for(let i=1;!p&&i<parts.length-1;i++)p=PUB[parts.slice(i).join(".")];return{host:h,country:p?.[0]||(s.local?s.country:null),own:p?.[1]||null}}
const ccName=c=>!c?null:c==="EU"?"European Union":(BY[c]?.name||c);
const KIND_INFO={"News report":"Aggregated: links to the publisher's own reporting. Prisma didn't write it.","Analysis":"Explains or interprets events rather than just reporting them.","Opinion":"A writer's view, not straight news.","Roundup":"A digest of several stories in one.","Live":"A live page that updates as events unfold.","Official source":"A statement from a government or official body, not independent reporting."};
function kind(s){const t=(s.title+" "+(trOf(s)||"")).toLowerCase(),u=(s.url||"").toLowerCase();
  if(pubInfo(s).own==="Government")return"Official source";
  if(/\/(opinion|comment|commentisfree|editorial)s?\//.test(u)||/^(opinion|comment|editorial|op-ed)\b/.test(t))return"Opinion";
  if(s.section==="Briefing"||/\b(roundup|round-up|digest|briefing|headlines for|newsletter|bulletin|recap|in review|week in)\b/.test(t))return"Roundup";
  if(/\blive\b|as it happened/.test(t)||/\/live[-\/]/.test(u))return"Live";
  if(/^(why|how|what|explainer)\b|\b(explainer|analysis|explained|takeaways)\b/.test(t)||/\/(analysis|explainer)s?\//.test(u))return"Analysis";
  return"News report"}
const kindChip=s=>{const k=kind(s);return `<span class="kind k-${k.split(" ")[0].toLowerCase()}" title="${esc(KIND_INFO[k])}">${k}</span>`};
const TOPICS=[
 {id:"conflict",label:"Conflict",sec:["War","Security"],re:/\b(war|missiles?|air ?strikes?|troops|military|attacks?|drones?|ceasefire|killed|armed|invasion|rebels?|army|bomb\w*|shelling|casualt\w*|warns)\b/i},
 {id:"elections",label:"Elections",sec:[],re:/\b(elections?|electoral|votes?|voting|voters|ballots?|polls?|runoff|referendum|campaign\w*|candidates?|midterms?|primary)\b/i},
 {id:"markets",label:"Markets",sec:["Business","Economy"],re:/\b(markets?|stocks?|shares|asx|nasdaq|rates?|inflation|econom\w*|gdp|bank\w*|budget|tariffs?|trade|oil|currenc\w*|prices?|ipo|profits?|investors?|loan)\b/i},
 {id:"ai",label:"AI & tech",sec:["Tech"],re:/\b(ai|artificial intelligence|data cent(re|er)s?|chips?|semiconductors?|tech\w*|cyber\w*|hack\w*|crypto\w*|software|startups?|nvidia|tsmc|quantum)\b/i},
 {id:"climate",label:"Climate",sec:["Climate","Environment"],re:/\b(climate|emissions?|carbon|floods?|flooding|drought|wildfires?|bushfires?|forest fires?|heatwave|storms?|cyclone|hurricane|typhoon|environment\w*|renewables?|solar|coal|water)\b/i},
 {id:"health",label:"Health",sec:["Health"],re:/\b(health|hospitals?|disease|virus|outbreak|vaccines?|dengue|cancer|covid|medical|doctors?|nurses?)\b/i},
 {id:"migration",label:"Migration",sec:[],re:/\b(migra\w*|refugees?|asylum|borders?|deport\w*|visas?|immigra\w*)\b/i},
 {id:"sport",label:"Sport",sec:["Sport"],re:/\b(football|soccer|cricket|rugby|tennis|olympics?|world cup|asian cup|league|squad|matildas|socceroos|nrl|afl|f1|grand prix|qualifiers?)\b/i}];
const TOPIC_BY=Object.fromEntries(TOPICS.map(t=>[t.id,t]));
function topicsOf(s){const t=s.title+" "+(trOf(s)||"");return TOPICS.filter(x=>x.re.test(t)||x.sec.includes(s.section)).map(x=>x.id)}
const clusterTopics=c=>[...new Set(c.items.flatMap(topicsOf))];

/* ---------- personal layer ---------- */
const DISTRESS=/\b(killed|kills|killing|dead|deaths?|died|dies|murder\w*|shooting|shot dead|stabb\w*|massacre|bodies|suicide|rape|sexual assault|abuse|terror\w*|bomb\w*|explosion|blast|crash(es|ed)?|casualt\w*|earthquake|wounded|injured|hostages?|executions?)\b/i;
const distressing=s=>DISTRESS.test(s.title+" "+(trOf(s)||""));
const isMuted=c=>S.mute.length>0&&clusterTopics(c).some(t=>S.mute.includes(t));
const isRead=s=>!!S.read[s.url];
const isNew=s=>!S.firstVisit&&!S.knownPrev.has(s.url)&&!isRead(s);
function markRead(s){if(!s||S.read[s.url])return;S.read[s.url]=today();const keys=Object.keys(S.read);if(keys.length>600)for(const k of keys.slice(0,keys.length-600))delete S.read[k];store.set("newsie.read",S.read)}
function pScore(c){let b=0;if(c.countries.some(cc=>S.follow.includes(cc)))b+=4;if(clusterTopics(c).some(t=>S.ftopics.includes(t)))b+=4;return c.score+b}
const heavy=c=>clusterTopics(c).includes("conflict")||c.items.some(distressing);
function lighten(xs){const light=xs.filter(c=>!heavy(c)),hv=xs.filter(heavy),out=[];while(light.length||hv.length){if(light.length)out.push(light.shift());if(light.length)out.push(light.shift());if(hv.length)out.push(hv.shift())}return out}
function feedClusters(){let xs=M.clusters.filter(c=>!isMuted(c));if(S.follow.length||S.ftopics.length)xs=[...xs].sort((a,b)=>pScore(b)-pScore(a));if(S.lighter)xs=lighten(xs);return xs}

function renderTop(){

function citeIn(text,nums){return esc(text).replace(/\[([A-Za-z0-9_,\s-]+)\]/g,(m,inner)=>{const ids=inner.split(/\s*,\s*/).filter(x=>nums[x]);if(!ids.length)return/^[a-z]{2}-\d+/.test(inner)?"":m;return ids.map(x=>`<sup><a href="#rep-${nums[x]}" data-jump="rep-${nums[x]}">${nums[x]}</a></sup>`).join("")})}

    ${tps.length?`<div class="tps">${tps.map(t=>`<button class="tpill" data-route="t-${t}">${TOPIC_BY[t].label}</button>`).join("")}</div>`:""}

function explainHTML(d,nums){const li=a=>(a||[]).filter(x=>typeof x==="string").map(x=>`<li>${citeIn(x,nums)}</li>`).join("");
  return `<h3>What happened</h3><p>${citeIn(d.what_happened||"",nums)}</p><h3>Why it matters</h3><p>${citeIn(d.why_it_matters||"The reports so far don't say.",nums)}</p>
  <div class="kdw"><div><h3>What we know</h3><ul>${li(d.know)||"<li>Only what's in the headline so far.</li>"}</ul></div><div><h3>What we don't know</h3><ul>${li(d.dont_know)||"<li>Not clear from the reports yet.</li>"}</ul></div><div><h3>What we're watching</h3><ul>${li(d.watching)||"<li>More reporting from other outlets.</li>"}</ul></div></div>
  ${d.coverage?`<h3>How it's being covered</h3><p>${citeIn(d.coverage,nums)}</p>`:""}<p class="fine">Written by AI from the headlines listed below, not from original reporting. Numbers in the text point to the reports.</p>`}
async function explainStory(id){const c=findCluster(id);if(!c)return;const s=c.lead;const sample=await getSample();
  if(!sample){S.explain[s.id]={state:"error",err:"Story context is coming soon."};refresh();return}
  S.explain[s.id]={state:"loading"};refresh();
  const reps=c.items.map(x=>({id:x.id,title:x.title,english:trOf(x)||undefined,source:x.source,country:BY[x.country].name,language:x.language||undefined,seen:(when(x)||nowRef()).toISOString()}));
  try{const out=await sample.json(`You are Prisma's context desk. ${VOICE}
Below is every report Prisma has on one story. Using ONLY what these reports say, return JSON:
{"what_happened":"1-2 sentences","why_it_matters":"1-2 sentences, only if the reports support it; otherwise exactly: The reports so far don't say.","know":["short fact [id]"],"dont_know":["open question the reports leave unanswered"],"watching":["concrete thing to watch next"],"coverage":"1-2 sentences on how outlets or countries frame it differently, or: Only one outlet has reported this so far."}
Rules: cite every factual claim with its report id in square brackets, e.g. [br-1]. Use only these ids. Up to 4 items in know, 3 in dont_know, 3 in watching. Never guess at numbers, causes or motives. Translate any non-English headline. Plain sentences, no markdown.
Reports: ${JSON.stringify(reps)}`,{modelTier:"quick"});
    S.explain[s.id]={state:"done",data:out||{}}}catch(e){S.explain[s.id]={state:"error",err:errMsg(e)}}refresh()}

/* ---------- brief: vertical swipe deck ---------- */
let D=null;
function deckFor(k){if(k==="top")return{label:"Prisma Brief",items:feedClusters().slice(0,10).map(c=>c.lead)};
  if(k==="new")return{label:"New since your last visit",items:feedClusters().filter(c=>c.items.some(isNew)).slice(0,15).map(c=>c.lead)};
  if(k.startsWith("t:")){const t=k.slice(2);return{label:TOPIC_BY[t]?.label||"Topic",items:M.clusters.filter(c=>clusterTopics(c).includes(t)).slice(0,10).map(c=>c.lead)}}
  if(k.startsWith("r:")){const rg=k.slice(2);return{label:rg,items:feedClusters().filter(c=>c.countries.some(cc=>BY[cc].region===rg)).slice(0,10).map(c=>c.lead)}}
  if(k.startsWith("c:")){const cc=k.slice(2);return{label:BY[cc].name,items:(M.byCountry[cc]||[]).slice(0,cc==="AU"?15:5)}}return null}
function openDeck(k,startAudio){const d=deckFor(k);if(!d||!d.items.length){toast("Nothing here yet. Try another region.");return}
  S.seen[k]=today();store.set("newsie.seen",S.seen);D={k,...d,i:0};document.body.style.overflow="hidden";
  $("overlay").innerHTML=`<div class="deck" id="deck" role="dialog" aria-modal="true" aria-label="${esc(d.label)}" tabindex="-1">
   <div class="dbar"><span class="lab">${esc(d.label)}</span><span class="prog" id="dprog">1/${d.items.length}</span><span class="ai"><b></b>Sources linked</span><button class="x" data-dclose="" aria-label="Close brief">×</button></div>
   <div class="dnav"><button data-dprev="" aria-label="Previous story">${I('<path d="M6 15l6-6 6 6"/>')}</button><button data-dnext="" aria-label="Next story">${I('<path d="M6 9l6 6 6-6"/>')}</button></div>
   <div class="sideprog" aria-hidden="true">${d.items.map((_,j)=>`<i class="${j===0?"on":""}"></i>`).join("")}</div>
   <aside class="dlist" aria-label="Running order"><h6>Running order</h6><ol>${d.items.map((s,j)=>`<li><button data-dgo="${j}" class="${j===0?"on":""}"><b class="num">${j+1}</b><span><small>${esc(BY[s.country].name)}</small>${esc(trOf(s)||s.title)}</span></button></li>`).join("")}</ol></aside>
   ${d.items.map((s,j)=>`<section class="slide" data-i="${j}"><div class="in"><div class="kick"><span class="place">${esc(BY[s.country].name)}</span><span class="when">${ago(s)||"today"}</span></div><h2>${esc(s.title)}</h2>${enLine(s)}<div class="src">${esc(s.source)}${s.outlets>1?` · ${s.outlets} outlets`:""}</div><div class="row"><button class="btn accent" data-route="story-${esc(s.id)}">Context</button>${pubA(s,'class="btn" aria-label="Read at publisher"')}${ICON.ext}</a><button class="btn" data-listen="${s.id}" aria-label="Listen">${ICON.listen}</button><button class="btn" data-share="${s.id}" aria-label="Share">${ICON.share}</button><button class="btn" data-askabout="${s.id}" aria-label="Ask about this">${ICON.ask}</button><button class="btn" data-save="${s.id}" aria-label="${S.saved[s.id]?"Saved":"Save"}">${ICON.save}</button></div>${j===0?`<div class="hint">Swipe up for the next story</div>`:""}</div></section>`).join("")}
   <section class="slide end" data-i="${d.items.length}"><div class="in"><div class="big num" id="endStreak">${streak()}</div><h2>You're caught up.</h2><p id="endMsg">That's the world, sorted. See you tomorrow.</p><div class="row" style="justify-content:center"><button class="btn accent" data-dclose="">Back to Today</button><button class="btn" data-dask="">Ask Prisma something</button></div></div></section></div>`;
  const deck=$("deck");deck.focus();
  const io=new IntersectionObserver(es=>{for(const e of es){if(e.isIntersecting&&e.intersectionRatio>.6){const i=+e.target.dataset.i;D.i=i;
    const pr=$("dprog");if(pr)pr.textContent=i>=D.items.length?"Done":`${i+1}/${D.items.length}`;
    document.querySelectorAll(".sideprog i").forEach((el,j)=>el.classList.toggle("on",j<=i));document.querySelectorAll(".dlist button").forEach((el,j)=>el.classList.toggle("on",j===i));document.querySelector(".dlist button.on")?.scrollIntoView({block:"nearest"});
    if(i>=D.items.length){const first=markInformed();$("endStreak").textContent=streak();$("endMsg").textContent=first?`${streak()} ${streak()===1?"day":"days"} informed. That's the world, sorted.`:"That's the world, sorted. See you tomorrow."}}}},{root:deck,threshold:[.6]});
  deck.querySelectorAll(".slide").forEach(el=>io.observe(el));D.io=io;
  if(startAudio)playQueue(d.items,true);
}
function deckGo(i){const el=document.querySelector(`.slide[data-i="${i}"]`);if(el)el.scrollIntoView({behavior:reduced()?"auto":"smooth"})}
function closeDeck(){if(!D)return;D.io?.disconnect();D=null;$("overlay").innerHTML="";document.body.style.overflow="";paintPlayer();if(S.route===""||S.route==="brief"){if(S.route==="brief")go("");else renderToday()}}

/* ---------- audio (one thumb) ---------- */
const TTS="speechSynthesis" in window&&"SpeechSynthesisUtterance" in window;
let A=null;
function lineFor(s){const place=BY[s.country].name;const t=isEnglish(s)?s.title:trOf(s);return t?`${place}. ${t}. From ${s.source}.`:`${place}: a story in ${s.language||"the local language"} from ${s.source}. Tap English on the card to translate it.`}
function pickVoice(){const vs=speechSynthesis.getVoices();return vs.find(v=>/en-AU/i.test(v.lang)&&LOCAL_AU)||vs.find(v=>/en-(GB|US)/i.test(v.lang)&&/natural|premium|enhanced/i.test(v.name))||vs.find(v=>/^en/i.test(v.lang))||null}
function playQueue(items,followDeck,texts){if(!TTS){toast("Audio isn't available in this browser.");return}speechSynthesis.cancel();A={items,texts:texts||items.map(lineFor),i:0,playing:true,followDeck};speakCur();paintPlayer()}
function speakCur(){if(!A)return;if(A.i>=A.texts.length){A.playing=false;paintPlayer();if(A.followDeck&&D)deckGo(D.items.length);if(!A.followDeck&&A.items.length>=5&&markInformed())toast(`${streak()} days informed. Nicely done.`);return}
  const u=new SpeechSynthesisUtterance(A.texts[A.i]);const v=pickVoice();if(v){u.voice=v;u.lang=v.lang}u.rate=1.04;
  u.onend=()=>{if(!A||!A.playing)return;A.i++;if(A.followDeck&&D&&A.i<D.items.length)deckGo(A.i);speakCur();paintPlayer()};u.onerror=()=>{if(A){A.playing=false;paintPlayer()}};
  speechSynthesis.speak(u)}
function togglePlay(){if(!A)return;if(A.playing){A.playing=false;speechSynthesis.cancel()}else{A.playing=true;speakCur()}paintPlayer()}
function nextItem(){if(!A)return;speechSynthesis.cancel();A.i++;A.playing=true;if(A.followDeck&&D)deckGo(A.i);speakCur();paintPlayer()}
function stopAudio(){if(TTS)speechSynthesis.cancel();A=null;paintPlayer()}
function paintPlayer(){const h=$("playerHost");if(!A){h.innerHTML="";return}const s=A.items[Math.min(A.i,A.items.length-1)];const done=A.i>=A.texts.length;
  h.innerHTML=`<div class="player ${D?"ondeck":""}" role="region" aria-label="Audio player"><div class="t"><b>${done?"Finished":A.playing?"Now playing":"Paused"} · ${Math.min(A.i+1,A.texts.length)}/${A.texts.length}</b><span>${esc(s?.title?(trOf(s)||s.title):"Prisma Daily")}</span></div><button class="pp" data-pp="" aria-label="${A.playing?"Pause":"Play"}">${A.playing?ICON.pause:ICON.play}</button><button data-pnext="" aria-label="Next">${ICON.next}</button><button data-pstop="" aria-label="Close player" style="font-size:22px">×</button></div>`}

function wrapLines(ctx,text,maxW){const words=text.split(/\s+/);const lines=[];let cur="";for(const w of words){const t=cur?cur+" "+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t}if(cur)lines.push(cur);return lines}
async function shareCanvas(s){try{await document.fonts?.load?.('800 80px "DM Sans"');await document.fonts?.load?.('600 40px "DM Sans"')}catch(e){}
  const W=1080,H=1920,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");const F='"DM Sans", system-ui, Arial, sans-serif';
  x.fillStyle="#0B0B0D";x.fillRect(0,0,W,H);x.fillStyle="#FF5A43";x.fillRect(0,0,W,18);
  x.fillStyle="#F5F5F6";x.font=`800 76px ${F}`;x.fillText("prisma",90,190);const lw=x.measureText("prisma").width;x.fillStyle="#FF5A43";x.fillText(".",90+lw,190);
  const place=BY[s.country].name.toUpperCase();x.font=`800 40px ${F}`;const pw=x.measureText(place).width+64;x.fillStyle="#FF5A43";x.beginPath();x.roundRect?x.roundRect(90,520,pw,84,42):x.rect(90,520,pw,84);x.fill();x.fillStyle="#1A0602";x.fillText(place,122,576);
  const title=trOf(s)&&!isEnglish(s)?trOf(s):s.title;let size=104;let lines;do{x.font=`800 ${size}px ${F}`;lines=wrapLines(x,title,W-180);size-=6}while(lines.length*size*1.08>760&&size>56);
  x.fillStyle="#F5F5F6";let y=700+size;for(const l of lines){x.fillText(l,90,y);y+=size*1.1}
  x.font=`600 44px ${F}`;x.fillStyle="#9C9CA5";x.fillText(`${s.source} · ${ago(s)||"today"}`,90,y+40);
  x.fillStyle="#17171B";x.fillRect(0,H-260,W,260);x.fillStyle="#4ADE80";x.beginPath();x.arc(108,H-148,12,0,7);x.fill();
  x.fillStyle="#CFCFD4";x.font=`600 40px ${F}`;x.fillText("AI-assisted · sources linked",136,H-134);x.fillStyle="#9C9CA5";x.font=`400 36px ${F}`;x.fillText(host(s.url),90,H-74);
  return c}
async function openShare(id){const s=M.byId[id]||S.saved[id];if(!s)return;
  const dl=await (async()=>{try{return await claude.use("downloads")}catch(e){return null}})();

/* ---------- AI ---------- */
async function getSample(){try{return await claude.use("sample")}catch(e){return null}}
const errMsg=e=>e?.code==="not_granted"?"Prisma needs your OK to use Claude for this. Allow it in the page's permissions, then try again.":e?.code==="rate_limited"?"Busy moment. Try again in a minute.":"That didn't work just now. Try again.";
const VOICE=`Voice: a smart friend who read everything. Conversational, quick, a little witty when the story allows it. Never joke about deaths, war, disasters, crime victims or other tragedies; be plain and kind there. No hype, no emoji.`;
async function makeTake(){if(S.takeState==="loading")return;const sample=await getSample();if(!sample){S.takeState="error";S.takeErr="Prisma Daily summaries are coming soon.";refresh();return}
  S.takeState="loading";refresh();const heads=M.clusters.slice(0,30).map((c,i)=>`${i+1}. [${c.countries.map(cc=>BY[cc].name).join(", ")}] ${c.lead.title} (${c.lead.source})`).join("\n");
  try{const out=await sample.json(`You write "Prisma Daily", the day in five lines for readers in their 20s and 30s. ${VOICE}\nUsing ONLY these headlines, write exactly 5 lines, one or two short sentences each, leading with the place and saying only what the headlines support. Translate any non-English headline. Return JSON {"items":["...","...","...","...","..."]}.\n\n${heads}`,{modelTier:"quick"});
    const items=(out?.items||[]).filter(x=>typeof x==="string").slice(0,5);if(!items.length)throw{};S.take=items;S.takeState="done"}catch(e){S.takeState="error";S.takeErr=errMsg(e)}refresh()}
async function translate(ids){ids=ids.filter(id=>M.byId[id]&&!isEnglish(M.byId[id])&&!trOf(M.byId[id]));if(!ids.length)return;const sample=await getSample();if(!sample){toast("Translations are coming soon.");return}
  toast("Translating…");try{const out=await sample.json(`Translate each news headline into natural English. Keep names accurate. Return JSON {"items":[{"id":"...","en":"..."}]} with the same ids.\n\n${JSON.stringify(ids.slice(0,40).map(id=>({id,text:M.byId[id].title})))}`,{modelTier:"quick"});
    for(const x of out?.items||[]){if(x&&M.byId[x.id]&&typeof x.en==="string")S.tr[x.id+"|"+M.byId[x.id].title.length]=x.en}store.set("newsie.tr",S.tr);refresh()}catch(e){toast(errMsg(e))}}
function storyRef(s){return{id:s.id,title:s.title,english_title:trOf(s)||undefined,language:s.language||"English",country:BY[s.country].name,region:BY[s.country].region,source:s.source,published:(when(s)||nowRef()).toISOString().slice(0,10),outlets:s.outlets||undefined}}
const TOOLS=[{name:"find_stories",description:"Search today's Prisma edition (top stories for every country). Filter by country name, region (Africa, Americas, Asia, Europe, Middle East, Oceania) or keywords. Returns the best-ranked matches with ids.",
  inputSchema:{type:"object",properties:{country:{type:"string"},region:{type:"string"},query:{type:"string"},limit:{type:"number"}}},
  execute(a={}){const el=$("thinking");if(el)el.querySelector("span").textContent="Reading today's stories…";let list=M.clusters.map(c=>c.lead);const leads=new Set(list);list=list.concat(M.stories.filter(s=>!leads.has(s)));
   if(a.country){const q=String(a.country).toLowerCase();const c=COUNTRIES.find(x=>x.name.toLowerCase()===q||x.code.toLowerCase()===q)||COUNTRIES.find(x=>x.name.toLowerCase().includes(q)||q.includes(x.name.toLowerCase()));if(!c)return{error:`No country called ${a.country}.`};list=list.filter(s=>s.country===c.code);if(!list.length)return{country:c.name,stories:[],note:`No stories for ${c.name} yet today.`}}
   if(a.region){const r=REGIONS.find(x=>x.toLowerCase()===String(a.region).toLowerCase());if(r)list=list.filter(s=>BY[s.country].region===r)}
   if(a.query){const ws=String(a.query).toLowerCase().split(/\s+/).filter(w=>w.length>2);if(ws.length)list=list.filter(s=>ws.some(w=>(s.title+" "+(trOf(s)||"")+" "+s.source).toLowerCase().includes(w)))}
   return{count:list.length,stories:list.slice(0,Math.max(1,Math.min(25,Number(a.limit)||12))).map(storyRef)}}}];
const SUGGEST=["What did I miss today?","What's the vibe in Europe right now?","Biggest story in Asia, in two lines","Anything big happening in Africa?","What's going on in my countries?"];
function renderAnswer(text){const ids=[];const cite=id=>{let i=ids.indexOf(id);if(i<0){ids.push(id);i=ids.length-1}return i+1};
  const paras=String(text).trim().split(/\n{2,}|\n(?=[-•*]\s)/).map(p=>p.replace(/^[-•*]\s+/,"").trim()).filter(Boolean);
  const html=paras.map(p=>"<p>"+esc(p).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\[([A-Za-z0-9_,\s-]+)\]/g,(m,inner)=>{const parts=inner.split(/\s*,\s*/).filter(x=>M.byId[x]);if(!parts.length)return /^[a-z]{2}-\d+/.test(inner)?"":m;return parts.map(x=>`<sup><a href="${esc(M.byId[x].url)}" target="_blank" rel="noopener">${cite(x)}</a></sup>`).join("")})+"</p>").join("");
  const srcs=ids.map((id,i)=>{const s=M.byId[id];return `<a href="${esc(s.url)}" target="_blank" rel="noopener"><b>${i+1}</b><span>${esc(s.title)} · ${esc(s.source)}</span></a>`}).join("");
  const places=[...new Set(ids.map(id=>M.byId[id].country))].slice(0,4);
  return html+(srcs?`<div class="srcs">${srcs}</div>`:"")+`<div class="foot"><span class="ai"><b></b>AI-assisted · sources linked</span>${places.map(cc=>`<button class="chip" data-route="map" data-sel="${cc}"><span class="cc">${cc}</span>On the map</button>`).join("")}</div>`}
function renderAsk(){$("view").innerHTML=`<div class="wrap"><div class="askpg"><div class="convo" id="convo"></div><form class="composer" id="composer"><input id="aq" placeholder="Ask about anywhere…" autocomplete="off" aria-label="Your question"><button type="submit" aria-label="Send">${ICON.send}</button></form></div></div>`;renderConvo();if(!S.chat.length&&innerWidth>=900)$("aq").focus()}
function renderConvo(){const el=$("convo");if(!el)return;
  if(!S.chat.length){el.innerHTML=`<div class="askhero"><h1 class="h1">What's happening, anywhere?</h1><p class="lede">Ask like you'd text a friend who read everything today. Answers come from stories in ${covered()} countries, with the sources attached.</p><div class="sugg">${SUGGEST.map(q=>`<button data-askq="${esc(q)}">${esc(q)}${ICON.arrow}</button>`).join("")}</div><p class="ai" style="margin-top:14px"><b></b>AI-assisted · sources linked</p></div>`;return}
  el.innerHTML=S.chat.map(m=>m.role==="user"?`<div class="msg user">${esc(m.content)}</div>`:m.pending?`<div class="msg bot" id="pending">${m.text?renderAnswer(m.text):`<div class="thinking" id="thinking"><i></i><i></i><i></i><span>Thinking…</span></div>`}</div>`:`<div class="msg bot">${m.error?`<p style="color:var(--muted)">${esc(m.error)}</p>`:renderAnswer(m.content)}</div>`).join("");
  requestAnimationFrame(()=>window.scrollTo({top:document.body.scrollHeight,behavior:reduced()?"auto":"smooth"}))}
async function ask(q){q=String(q||"").trim();if(!q||S.busy)return;if(S.route!=="ask")go("ask");
  S.busy=true;S.chat.push({role:"user",content:q});const bot={role:"assistant",pending:true,text:""};S.chat.push(bot);renderConvo();
  const sample=await getSample();if(!sample){Object.assign(bot,{pending:false,error:"Ask Prisma is coming soon."});S.busy=false;renderConvo();return}
  const brief=`You are Prisma's assistant. ${VOICE} Today is ${new Date().toLocaleDateString("en-AU",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}. The reader follows: ${S.follow.map(c=>BY[c].name).join(", ")||"nothing yet"}.
Answer ONLY from stories returned by find_stories; call it before answering and never add outside facts.
Cite every factual sentence with the story id in square brackets right after it, e.g. "Lula won a fourth term [br-1]." Use only ids the tool returned.
Keep it tight: 2–4 short paragraphs or up to 5 lines starting with "- ". Translate local-language headlines into English. If a place has nothing today, say so in a line and offer somewhere nearby that does.`;
  const history=S.chat.filter(m=>!m.pending&&!m.error).slice(-6).map(m=>({role:m.role,content:m.content}));while(history.length&&history[0].role!=="user")history.shift();
  history[0]={...history[0],content:brief+"\n\nQuestion: "+history[0].content};if(history.length>1)history[history.length-1]={role:"user",content:"(Search again for this.) "+history[history.length-1].content};
  try{const res=await sample(history,{tools:TOOLS,modelTier:"quick",cache:false,onText:({text})=>{bot.text=text;const el=$("pending");if(el)el.innerHTML=renderAnswer(text)}});Object.assign(bot,{pending:false,content:res.text||bot.text||"Nothing on that today, honestly."})}
  catch(e){Object.assign(bot,{pending:false,error:errMsg(e)});if(e?.text)Object.assign(bot,{error:null,content:e.text})}
  S.busy=false;renderConvo()}

function route(r){S.route=r;document.body.classList.toggle("r-map",r==="map");document.body.classList.toggle("r-today",r===""||r==="today");renderChrome();mapCtx=null;closeSheet();
  if(r==="brief"){if(S.loaded){renderToday();if(!D)openDeck("top")}else $("view").innerHTML=emptyHTML();return}
  if(!S.loaded&&!["ask","you","countries","map","standards","search"].includes(r)){$("view").innerHTML=S.error?emptyHTML():`<div class="wrap skel"><i></i><i></i><i></i></div>`;return}
  if(r.startsWith("story-")){if(r!==S.lastStory){S.lastStory=r;countOpen();markRead(M.byId[r.slice(6)])}renderStory(r.slice(6));return}
  if(r.startsWith("t-")&&TOPIC_BY[r.slice(2)]){renderTopic(r.slice(2));return}
  if(r==="standards"){renderStandards();return}
  if(r==="search"){renderSearch();return}
  if(r==="top")renderTop();else if(r==="map")renderMap();else if(r==="ask")renderAsk();else if(r==="you")renderYou();else if(r==="countries")renderCountries();
  else if(r.length===2&&BY[r.toUpperCase()])renderCountry(r.toUpperCase());else{S.route="";renderChrome();renderToday()}}
function go(r,sel){if(r.startsWith("story-")&&!S.route.startsWith("story-"))S.prev=S.route;if(sel){S.sel=sel;S.mapRegion=null}if(D&&r!=="brief"){D.io?.disconnect();D=null;$("overlay").innerHTML="";document.body.style.overflow=""}closeSheet();try{history.replaceState(null,"",r?"#"+r:location.pathname+location.search)}catch(e){location.hash=r}route(r);if(r!=="ask")window.scrollTo({top:0,behavior:"auto"})}
async function copy(text){try{await navigator.clipboard.writeText(text);toast("Link copied")}catch(e){toast("Couldn't copy here. Long-press the headline instead.")}}
document.addEventListener("click",e=>{const t=e.target;
  const op=t.closest("[data-open]");if(op){countOpen();markRead(M.byId[op.dataset.open]);return}
  if(t.closest("[data-sclose]")){closeSheet();return}
  if(t.closest("[data-dclose]")){closeDeck();return}
  if(t.closest("[data-dnext]")){if(D)deckGo(Math.min(D.i+1,D.items.length));return}
  if(t.closest("[data-dprev]")){if(D)deckGo(Math.max(D.i-1,0));return}
  if(t.closest("[data-dask]")){closeDeck();go("ask");return}
  if(t.closest("[data-oskip]")){store.set("newsie.onboarded",true);S.onb=null;paintOnb();refresh();return}
  const ost=t.closest("[data-ostep]");if(ost&&S.onb){S.onb.step=Math.max(0,Math.min(2,S.onb.step+Number(ost.dataset.ostep)));if(S.onb.step===2&&S.onb.home&&!S.onb.countries.length&&M.byCountry[S.onb.home]?.length)S.onb.countries=[S.onb.home];paintOnb();return}
  const od=t.closest("[data-odone]");if(od){finishOnb(od.dataset.odone);return}
  const oh=t.closest("[data-ohome]");if(oh&&S.onb){S.onb.home=oh.dataset.ohome;paintOnb();return}
  const otp=t.closest("[data-otopic]");if(otp&&S.onb){const v=otp.dataset.otopic;S.onb.topics=S.onb.topics.includes(v)?S.onb.topics.filter(x=>x!==v):[...S.onb.topics,v];paintOnb();return}
  const oc=t.closest("[data-ocountry]");if(oc&&S.onb){const v=oc.dataset.ocountry;S.onb.countries=S.onb.countries.includes(v)?S.onb.countries.filter(x=>x!==v):[...S.onb.countries,v];paintOnb();return}
  const otm=t.closest("[data-otime]");if(otm&&S.onb){S.onb.time=otm.dataset.otime;paintOnb();return}
  if(t.closest("[data-onb]")){startOnb();return}
  const rv=t.closest("[data-reveal]");if(rv){S.revealed.add(rv.dataset.reveal);refresh();return}
  const ft=t.closest("[data-ftopic]");if(ft){const v=ft.dataset.ftopic;S.ftopics=S.ftopics.includes(v)?S.ftopics.filter(x=>x!==v):[...S.ftopics,v];store.set("newsie.ftopics",S.ftopics);toast(S.ftopics.includes(v)?`Following ${TOPIC_BY[v].label}`:`Unfollowed ${TOPIC_BY[v].label}`);refresh();return}
  const mu=t.closest("[data-mute]");if(mu){const v=mu.dataset.mute;S.mute=S.mute.includes(v)?S.mute.filter(x=>x!==v):[...S.mute,v];store.set("newsie.mute",S.mute);toast(S.mute.includes(v)?`Muted ${TOPIC_BY[v].label}`:`Unmuted ${TOPIC_BY[v].label}`);refresh();return}
  const tg=t.closest("button[data-toggle]");if(tg){const k=tg.dataset.toggle;S[k]=!S[k];store.set("newsie."+k,S[k]);refresh();return}
  const zm=t.closest("button[data-zoom]");if(zm){S.zoom=Number(zm.dataset.zoom);store.set("newsie.zoom",S.zoom);applyComfort();refresh();return}
  const sp=t.closest("button[data-spacing]");if(sp){S.spacing=sp.dataset.spacing;store.set("newsie.spacing",S.spacing);applyComfort();refresh();return}
  const mo=t.closest("button[data-motion]");if(mo){S.motion=mo.dataset.motion;store.set("newsie.motion",S.motion);applyComfort();refresh();return}
  const qf=t.closest("[data-qf]");if(qf){const [k,v]=qf.dataset.qf.split(":");S.qf[k]=v;renderSearch();return}
  const qs=t.closest("[data-qset]");if(qs){S.q=qs.dataset.qset;saveRecent();renderSearch();return}
  if(t.closest("[data-qclear]")){S.q="";renderSearch();$("sq")?.focus();return}
  if(t.closest("[data-qrecentclear]")){S.recent=[];store.set("newsie.recent",[]);renderSearch();return}
  if(t.closest("[data-qsave]"))saveRecent();
  const xc=t.closest("[data-excard]");if(xc){openExCard(xc.dataset.excard);return}
  const sx=t.closest("[data-saveex]");if(sx){saveExCard(sx.dataset.saveex);return}
  const ex=t.closest("[data-explain]");if(ex){explainStory(ex.dataset.explain);return}
  const jp=t.closest("[data-jump]");if(jp){e.preventDefault();const el=$(jp.dataset.jump);if(el){el.scrollIntoView({behavior:reduced()?"auto":"smooth",block:"center"});el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),1200)}return}
  const sc2=t.closest("[data-scope]");if(sc2){const v=sc2.dataset.scope;if(v==="local"&&!S.home){openSheet(`<h3>Pick your country</h3><p>The Local edition puts its stories first, then its region, then the world.</p><div class="opts">${COUNTRIES.filter(c=>M.byCountry[c.code]?.length).map(c=>`<button class="btn" data-sethome="${c.code}">${esc(c.name)}</button>`).join("")}</div><p class="muted" style="margin-top:10px">More countries are available in You.</p>`);return}S.scope=v;store.set("newsie.scope",v);renderToday();return}
  const sh3=t.closest("[data-sethome]");if(sh3){S.home=sh3.dataset.sethome;S.scope="local";store.set("newsie.home",S.home);store.set("newsie.scope","local");closeSheet();renderToday();return}
  if(t.closest("[data-askfield]")){go("ask");setTimeout(()=>$("aq")?.focus(),30);return}
  const dg=t.closest("[data-dgo]");if(dg&&D){deckGo(Number(dg.dataset.dgo));return}
  const dk=t.closest("[data-deck]");if(dk){openDeck(dk.dataset.deck);return}
  if(t.closest("[data-listenall]")){const items=M.clusters.slice(0,10).map(c=>c.lead);openDeck("top",true);return}
  if(t.closest("[data-listentake]")){if(S.take)playQueue(S.take.map(()=>null),false,["Prisma Daily.",...S.take]);return}
  const ls=t.closest("[data-listen]");if(ls){const s=M.byId[ls.dataset.listen];if(s)playQueue([s],false);return}
  if(t.closest("[data-pp]")){togglePlay();return}if(t.closest("[data-pnext]")){nextItem();return}if(t.closest("[data-pstop]")){stopAudio();return}
  const sv=t.closest("[data-save]");if(sv){const id=sv.dataset.save;const s=M.byId[id];if(S.saved[id])delete S.saved[id];else if(s)S.saved[id]={...s};store.set("newsie.saved",S.saved);toast(S.saved[id]?"Saved for later":"Removed from saved");if(!D)refresh();return}
  const sh=t.closest("[data-share]");if(sh){openShare(sh.dataset.share);return}
  const sc=t.closest("[data-savecard]");if(sc){saveCard(sc.dataset.savecard);return}
  const cl=t.closest("[data-copylink]");if(cl){const s=M.byId[cl.dataset.copylink];if(s)copy(s.url);return}
  const tr=t.closest("[data-tr]");if(tr){translate([tr.dataset.tr]);return}
  const aa=t.closest("[data-askabout]");if(aa){const s=M.byId[aa.dataset.askabout];if(D)closeDeck();if(s)ask(`Tell me more about this story from ${BY[s.country].name}: "${s.title}"`);return}
  const aq=t.closest("[data-askq]");if(aq){ask(aq.dataset.askq);return}
  if(t.closest("#takeBtn")){makeTake();return}
  const sh2=t.closest("[data-sheet]");if(sh2){trustSheet();return}
  const fo=t.closest("[data-follow]");if(fo){const c=fo.dataset.follow;S.follow=S.follow.includes(c)?S.follow.filter(x=>x!==c):[...S.follow,c];store.set("newsie.follow",S.follow);toast(S.follow.includes(c)?`Following ${BY[c].name}`:`Unfollowed ${BY[c].name}`);if(S.route==="map")renderPanel();else refresh();return}
  const so=t.closest("[data-sort]");if(so){S.sort=so.dataset.sort;renderTop();return}
  const pr=t.closest("[data-pregion]");if(pr){S.region=pr.dataset.pregion;renderTop();return}
  const mr=t.closest("[data-mregion]");if(mr){const r=mr.dataset.mregion;S.sel=null;S.mapRegion=r==="World"?null:r;document.querySelectorAll("[data-mregion]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.mregion===r)));mapCtx?.g.selectAll(".country-shape").classed("sel",false);renderPanel();if(S.mapRegion)focusRegion(S.mapRegion);else mapCtx?.svg.transition().duration(400).call(mapCtx.zoom.transform,d3.zoomIdentity);return}
  const th=t.closest("[data-theme-set]");if(th){S.theme=th.dataset.themeSet;store.set("newsie.theme",S.theme);applyTheme();refresh();return}
  const r=t.closest("[data-route]");if(r){e.preventDefault();go(r.dataset.route,r.dataset.sel);return}
});
document.addEventListener("submit",e=>{e.preventDefault();if(e.target.id==="sform"){S.q=$("sq").value;saveRecent();renderSearch();$("sq")?.blur();return}if(e.target.id==="composer"){const v=$("aq").value;$("aq").value="";ask(v)}});
document.addEventListener("keydown",e=>{const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName||"");
  if(!typing&&!D&&!S.onb&&!e.metaKey&&!e.ctrlKey&&!e.altKey){if(e.key==="/"){e.preventDefault();go("search");setTimeout(()=>$("sq")?.focus(),30);return}if(e.key==="a"||e.key==="A"){e.preventDefault();go("ask");setTimeout(()=>$("aq")?.focus(),30);return}if(e.key==="b"||e.key==="B"){if(S.loaded)openDeck("top");return}}
  if(e.key==="Escape"){if(S.onb){store.set("newsie.onboarded",true);S.onb=null;paintOnb();refresh()}else if($("sheetHost").innerHTML)closeSheet();else if(D)closeDeck()}else if(D&&(e.key==="ArrowDown"||e.key==="j")){e.preventDefault();deckGo(Math.min(D.i+1,D.items.length))}else if(D&&(e.key==="ArrowUp"||e.key==="k")){e.preventDefault();deckGo(Math.max(D.i-1,0))}});
window.addEventListener("hashchange",()=>route(location.hash.slice(1).toLowerCase()));
function refresh(){build();paintStreak();if(D)return;if(S.route==="map"&&mapCtx&&$("bigmap")){mapCtx.g.selectAll(".country-shape").attr("fill",d=>fillFor(d.id));mapCtx.g.selectAll(".pin").attr("fill",d=>(M.byCountry[d.id]||[]).length?"var(--hit5)":"var(--faint)");renderPanel();return}
  if(S.route==="countries"&&document.activeElement?.id==="cq"){renderCountries();return}if(S.route==="ask"){renderConvo();return}if(S.route==="search"&&document.activeElement?.id==="sq"){renderSearch();return}
  const y=scrollY;route(S.route);scrollTo({top:y})}
build();route(location.hash.slice(1).toLowerCase());

(async()=>{
  const timer=setTimeout(()=>{if(!S.loaded){S.error="Reload the page to try again.";refresh()}},10000);
  const db=await claude.use("db");if(!db){clearTimeout(timer);S.error="Today's edition couldn't load. Try again shortly.";refresh();return}
  let got=0;const ready=()=>{if(++got>=2&&!S.loaded){clearTimeout(timer);S.loaded=true;S.error=null;refresh();store.set("newsie.known",[...new Set([...S.knownPrev,...M.stories.map(x=>x.url)])].slice(-1500));if(!store.get("newsie.onboarded",false)&&!S.route.startsWith("story-"))setTimeout(()=>{if(!D&&!S.onb)startOnb()},400);if(S.route==="brief"&&!D)openDeck("top")}else if(S.loaded)refresh()};
  db.doc("meta/edition").get().then(d=>{if(d.exists)S.meta=d.data();if(S.loaded)refresh()}).catch(()=>{});
  db.collection("stories").onSnapshot(snap=>{S.stories=snap.docs.map(d=>({id:d.id,...d.data()})).filter(s=>s.title&&s.url&&s.country);ready()},()=>ready());
  db.collection("corrections").onSnapshot(snap=>{S.corrections=snap.docs.map(d=>d.data()).filter(Boolean);if(S.route==="standards")renderStandards()},()=>{});
  db.collection("editions").onSnapshot(snap=>{const ed={};for(const d of snap.docs){const x=d.data();if(x&&Array.isArray(x.stories))ed[d.id.toUpperCase()]=x}S.editions=ed;ready()},()=>ready());
})();
</script>
